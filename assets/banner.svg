<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <!-- 배경 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F5F5F7"/>
    </linearGradient>
    <!-- 파스텔 블러 -->
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
    <!-- 이름 그라데이션 -->
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0071E3"/>
      <stop offset="0.5" stop-color="#7B61FF"/>
      <stop offset="1" stop-color="#FF6FAE"/>
    </linearGradient>
    <clipPath id="round">
      <rect width="1200" height="320" rx="28"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <circle cx="980" cy="70" r="140" fill="#CFE3FF" opacity="0.8" filter="url(#blur)"/>
    <circle cx="1120" cy="260" r="120" fill="#F3D9FF" opacity="0.8" filter="url(#blur)"/>
    <circle cx="180" cy="300" r="110" fill="#E6F0FF" opacity="0.7" filter="url(#blur)"/>
    <rect x="0.5" y="0.5" width="1199" height="319" rx="28" fill="none" stroke="#E5E5EA"/>
  </g>

  <g font-family="-apple-system, 'SF Pro Display', 'Apple SD Gothic Neo', 'Pretendard', 'Segoe UI', 'Malgun Gothic', sans-serif">
    <text x="600" y="92" text-anchor="middle" font-size="18" font-weight="600" letter-spacing="4" fill="#86868B">INDIE GAME DEVELOPER</text>
    <text x="600" y="182" text-anchor="middle" font-size="76" font-weight="700" letter-spacing="-1.5" fill="#1D1D1F">Hi, I'm <tspan fill="url(#name)">지혁</tspan>.</text>
    <text x="600" y="232" text-anchor="middle" font-size="22" font-weight="400" fill="#6E6E73">Yuhan University · Unreal · Unity · Roblox</text>
  </g>
</svg>
